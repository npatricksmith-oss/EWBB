# Codex: run without approval prompts, but confined by the OS sandbox.
# Commands can write only inside this project (plus temp dirs) and have no network.
approval_policy = "never"
sandbox_mode = "workspace-write"
# The model's own web search tool runs on OpenAI's side, so research works while shell commands stay offline
web_search = "live"

[sandbox_workspace_write]
network_access = false
